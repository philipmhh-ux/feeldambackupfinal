<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dce8bf">
  <meta
    name="description"
    content="키링을 대면 만나는 오늘의 문장, 필담."
  >
  <title>筆談 — 오늘의 문장</title>

  <!-- 글씨체 선택용 웹 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --green: #dce8bf;
      --green-deep: #29402d;
      --paper: #f8f6ec;
      --ink: #24271f;
      --muted: #73786b;
      --line: rgba(36, 39, 31, .18);
      --rust: #a94e38;

      --quote-font: "Gowun Batang", serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--green);
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
    }

    button,
    select {
      font: inherit;
    }

    .page {
      width: min(100% - 48px, 1120px);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* 상단에는 글자 없이 로고만 표시 */
    .site-header {
      min-height: 78px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      display: block;
      color: var(--green-deep);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 440px);
      align-items: center;
      gap: clamp(40px, 8vw, 112px);
      padding: 58px 0 72px;
    }

    .intro {
      padding-bottom: 8px;
    }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--rust);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .15em;
    }

    h1 {
      margin: 0;
      color: var(--green-deep);
      font-family: "Gowun Batang", serif;
      font-size: clamp(44px, 7vw, 76px);
      font-weight: 400;
      letter-spacing: -.065em;
      line-height: 1.25;
    }

    .intro-copy {
      max-width: 340px;
      margin: 25px 0 0;
      color: #4e5949;
      font-size: 14px;
      line-height: 1.9;
    }

    .quote-card {
      position: relative;
      min-height: 460px;
      padding: 30px 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--paper);
      box-shadow: 0 14px 34px rgba(40, 48, 31, .09);
    }

    .quote-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 32px;
      width: 42px;
      height: 4px;
      background: var(--rust);
    }

    .card-top,
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .quote-number,
    .quote-source {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .08em;
    }

    .quote-source {
      text-align: right;
      letter-spacing: .04em;
    }

    .quote-content {
      margin: 32px 0;
    }

    blockquote {
      margin: 0;
      font-family: var(--quote-font);
      font-size: clamp(25px, 3vw, 35px);
      line-height: 1.8;
      letter-spacing: -.035em;
      word-break: keep-all;
      transition: font-family .15s ease;
    }

    .quote-meta {
      margin-top: 17px;
      color: #5f6258;
      font-size: 13px;
      line-height: 1.7;
    }

    .quote-meta strong {
      color: var(--ink);
      font-weight: 700;
    }

    .font-control {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
    }

    .font-control label {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
    }

    .font-select {
      width: 100%;
      min-height: 40px;
      padding: 0 32px 0 11px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
    }

    .font-select:focus-visible,
    .button:focus-visible {
      outline: 3px solid var(--rust);
      outline-offset: 3px;
    }

    .card-bottom {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .button {
      min-height: 46px;
      padding: 0 17px;
      border: 1px solid var(--green-deep);
      background: var(--green-deep);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      transition: background .15s ease, color .15s ease;
    }

    .button:hover {
      background: transparent;
      color: var(--green-deep);
    }

    .site-footer {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--line);
      color: #58604f;
      font-size: 11px;
      letter-spacing: .03em;
    }

    @media (max-width: 760px) {
      .page {
        width: min(100% - 32px, 540px);
      }

      .site-header {
        min-height: 68px;
      }

      .brand-logo {
        width: 38px;
        height: 38px;
      }

      main {
        grid-template-columns: 1fr;
        gap: 32px;
        padding: 42px 0 48px;
      }

      .eyebrow {
        margin-bottom: 14px;
      }

      h1 {
        font-size: clamp(42px, 12vw, 62px);
      }

      .intro-copy {
        margin-top: 15px;
      }

      .quote-card {
        min-height: 430px;
        padding: 27px 23px 21px;
      }

      .quote-card::before {
        left: 23px;
      }

      .quote-content {
        margin: 27px 0;
      }

      .site-footer {
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="site-header">
      <!-- 글자 없이 만든 필담 그래픽 로고 -->
      <svg
        class="brand-logo"
        viewBox="0 0 48 48"
        role="img"
        aria-label="필담 로고"
        xmlns="http://www.w3.org/2000/svg"
      >
        <circle
          cx="24"
          cy="24"
          r="21"
          fill="none"
          stroke="currentColor"
          stroke-width="1.2"
        />
        <path
          d="M15 16.5h17M15 21h13"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <path
          d="M18 15v17"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
        />
        <path
          d="M27 25.5c3.4 0 5.6 1.7 5.6 4.1 0 2.3-2 3.9-5.7 3.9"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <path
          d="M25 35.5 34 17"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
        />
      </svg>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">오늘, 우연히 만난 문장</p>
        <h1 id="page-title">책장을 넘기듯<br>마음을 넘겨요.</h1>
        <p class="intro-copy">
          키링을 톡 대면 문장 하나가 도착합니다.<br>
          마음에 남는 문장은 천천히 읽어 보세요.
        </p>
      </section>

      <section class="quote-card" aria-label="오늘의 문장">
        <div class="card-top">
          <span class="quote-number" id="quote-number"></span>
          <span class="quote-source">筆談 · QUOTE CARD</span>
        </div>

        <div class="quote-content">
          <blockquote id="quote-text" aria-live="polite"></blockquote>
          <div class="quote-meta">
            <strong id="quote-author"></strong><br>
            <span id="quote-work"></span>
          </div>
        </div>

        <div class="font-control">
          <label for="font-select">글씨체</label>
          <select class="font-select" id="font-select">
            <option value="gowun-batang">고운 바탕</option>
            <option value="nanum-myeongjo">나눔 명조</option>
            <option value="nanum-pen">나눔 손글씨</option>
            <option value="gowun-dodum">고운 돋움</option>
            <option value="system-serif">기본 명조</option>
          </select>
        </div>

        <div class="card-bottom">
          <span class="quote-source">천천히 읽어 보세요.</span>
          <button class="button" id="draw-button" type="button">
            다른 문장 보기 ↗
          </button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 筆談 · 문장을 담아 전합니다</span>
      <span>한 번 더, 천천히 읽어보기</span>
    </footer>
  </div>

    const quoteText = document.getElementById("quote-text");
    const quoteAuthor = document.getElementById("quote-author");
    const quoteWork = document.getElementById("quote-work");
    const quoteNumber = document.getElementById("quote-number");
    const fontSelect = document.getElementById("font-select");

    const BAG_KEY = "pildam-quote-bag-v3";
    const LAST_KEY = "pildam-last-quote-v3";
    const FONT_KEY = "pildam-font-v1";

    let currentQuote = null;

    const fontMap = {
      "gowun-batang": '"Gowun Batang", serif',
      "nanum-myeongjo": '"Nanum Myeongjo", serif',
      "nanum-pen": '"Nanum Pen Script", cursive',
      "gowun-dodum": '"Gowun Dodum", sans-serif',
      "system-serif": '"Batang", "Noto Serif KR", serif'
    };

    function readStorage(key) {
      try {
        return localStorage.getItem(key);
      } catch {
        return null;
      }
    }

    function writeStorage(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch {
        // 저장이 차단된 환경에서도 페이지는 계속 사용할 수 있습니다.
      }
    }

    function shuffle(items) {
      const result = [...items];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function makeNewBag() {
      const bag = shuffle(quotes.map((_, index) => index));
      const lastIndex = Number(readStorage(LAST_KEY));

      // 새 묶음의 첫 문장이 직전 문장과 같아지는 것을 막습니다.
      if (bag.length > 1 && bag[bag.length - 1] === lastIndex) {
        [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
      }

      return bag;
    }

    function getBag() {
      try {
        const saved = JSON.parse(readStorage(BAG_KEY));

        if (
          Array.isArray(saved) &&
          saved.every(index =>
            Number.isInteger(index) &&
            index >= 0 &&
            index < quotes.length
          )
        ) {
          return saved;
        }
      } catch {
        // 저장된 목록이 없거나 올바르지 않으면 새 목록을 만듭니다.
      }

      return makeNewBag();
    }

    function drawQuote() {
      let bag = getBag();

      if (bag.length === 0) {
        bag = makeNewBag();
      }

      const index = bag.pop();
      currentQuote = quotes[index];

      quoteText.textContent = `“${currentQuote[0]}”`;
      quoteAuthor.textContent = currentQuote[1];
      quoteWork.textContent = currentQuote[2];
      quoteNumber.textContent =
        `NO. ${String(index + 1).padStart(3, "0")} / ${quotes.length}`;

      writeStorage(BAG_KEY, JSON.stringify(bag));
      writeStorage(LAST_KEY, String(index));
    }

    function applyFont(fontKey) {
      const selectedFont = fontMap[fontKey] ? fontKey : "gowun-batang";

      document.documentElement.style.setProperty(
        "--quote-font",
        fontMap[selectedFont]
      );

      fontSelect.value = selectedFont;
      writeStorage(FONT_KEY, selectedFont);
    }

    document
      .getElementById("draw-button")
      .addEventListener("click", drawQuote);

    fontSelect.addEventListener("change", event => {
      applyFont(event.target.value);
    });

    applyFont(readStorage(FONT_KEY) || "gowun-batang");
    drawQuote();
  </script>
